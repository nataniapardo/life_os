<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Life OS | AI Productivity</title>

  <link rel="stylesheet" href="styles.css"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Icons + Charts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dark-mode">

<!-- ═════════════════════ -->
<!-- 🔐 AUTH SECTION -->
<!-- ═════════════════════ -->
<div id="authSection" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:10px;">
  <h1>Life OS Login</h1>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <div>
    <button onclick="signUp()">Sign Up</button>
    <button onclick="signIn()">Login</button>
  </div>
</div>

<!-- ═════════════════════ -->
<!-- 🚀 MAIN APP (HIDDEN UNTIL LOGIN) -->
<!-- ═════════════════════ -->
<div class="app-container" id="appContainer" style="display:none;">

  <!-- 🔓 ADD LOGOUT BUTTON -->
  <div style="position:fixed;top:10px;right:10px;z-index:9999;">
    <button onclick="logout()">Logout</button>
  </div>

  <!-- 👉 EVERYTHING BELOW IS YOUR ORIGINAL APP (UNCHANGED) -->

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-wrap">
        <span class="logo-text">LIFE</span>
        <div class="globe-outer"><div class="globe-inner"></div></div>
        <span class="logo-text">OS</span>
      </div>
    </div>
    <!-- (rest of your sidebar unchanged...) -->
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <!-- KEEP EVERYTHING EXACTLY AS YOU HAD -->
    <!-- (dashboard, todo, calendar, notes, etc.) -->
  </main>

</div>

<!-- ═════════════════════ -->
<!-- 🔌 SCRIPTS -->
<!-- ═════════════════════ -->

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<!-- Your existing scripts -->
<script src="ai_intelligence.js"></script>
<script src="script.js"></script>

<!-- Auth logic -->
<script src="app.js"></script>

</body>
</html>
