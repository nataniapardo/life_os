<!DOCTYPE html>
<html>
<head>
  <title>Supabase Auth + DB App</title>
</head>

<body>

<h1>My Supabase App</h1>

<!-- AUTH SECTION -->
<div id="auth-section">
  <h2>Login / Signup</h2>

  <input id="email" placeholder="email"><br><br>
  <input id="password" type="password" placeholder="password"><br><br>

  <button onclick="signUp()">Sign Up</button>
  <button onclick="signIn()">Login</button>
</div>

<!-- APP SECTION -->
<div id="app-section" style="display:none;">
  <h2>Welcome 👋</h2>

  <button onclick="logout()">Logout</button>

  <hr>

  <h3>Your Tasks</h3>
  <ul id="task-list"></ul>

  <input id="task-input" placeholder="new task">
  <button onclick="addTask()">Add</button>
</div>


<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_ANON_KEY"
)

let currentUser = null


// -------------------- AUTH --------------------

// SIGN UP
window.signUp = async function () {
  const email = document.getElementById("email").value
  const password = document.getElementById("password").value

  const { data, error } = await supabase.auth.signUp({
    email,
    password
  })

  console.log(data, error)
  alert("Check email (if confirmation is enabled)")
}


// LOGIN
window.signIn = async function () {
  const email = document.getElementById("email").value
  const password = document.getElementById("password").value

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  })

  if (data.user) {
    currentUser = data.user
    showApp()
    loadTasks()
  }

  console.log(error)
}


// LOGOUT
window.logout = async function () {
  await supabase.auth.signOut()
  currentUser = null

  document.getElementById("auth-section").style.display = "block"
  document.getElementById("app-section").style.display = "none"
}



// -------------------- UI CONTROL --------------------

function showApp() {
  document.getElementById("auth-section").style.display = "none"
  document.getElementById("app-section").style.display = "block"
}


// Check session on page load
const { data } = await supabase.auth.getUser()

if (data.user) {
  currentUser = data.user
  showApp()
  loadTasks()
}



// -------------------- DATABASE --------------------


// LOAD TASKS (ONLY USER DATA)
async function loadTasks() {
  const { data, error } = await supabase
    .from("tasks")
    .select("*")
    .eq("user_id", currentUser.id)

  document.getElementById("task-list").innerHTML =
    data.map(t => `<li>${t.title}</li>`).join("")
}


// ADD TASK
window.addTask = async function () {
  const value = document.getElementById("task-input").value

  await supabase.from("tasks").insert([
    {
      title: value,
      user_id: currentUser.id
    }
  ])

  loadTasks()
}

</script>

</body>
</html>
